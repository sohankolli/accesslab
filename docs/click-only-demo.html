<!doctype html>
<!--
  Demo for AccessLab's model suggestions. The rules score this page 100. It has
  four click-only controls: the two tabs, the close "×" and "Choose Team".
  With the current model switched on, the Workbench makes no suggestions here:
  none of the page's 10 candidates, including the four click-only controls,
  reaches the model's threshold. The model is experimental and off by default.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Click-only controls demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        color: #1d2422;
      }
      .tabs {
        display: flex;
        gap: 8px;
        list-style: none;
        padding: 0;
      }
      .tabs li {
        cursor: pointer;
        padding: 8px 14px;
        border-radius: 6px;
        background: #e8f1ee;
      }
      .btn {
        display: inline-block;
        cursor: pointer;
        padding: 10px 18px;
        border-radius: 8px;
        background: #1f6f5c;
        color: #fff;
      }
      .close {
        cursor: pointer;
        float: right;
        font-size: 20px;
      }
      .card {
        border: 1px solid #d5dcda;
        border-radius: 12px;
        padding: 16px;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Plans</h1>
      <ul class="tabs">
        <li class="tab active">Monthly</li>
        <li class="tab">Yearly</li>
      </ul>
      <div class="card">
        <span class="close" onclick="this.parentElement.remove()">×</span>
        <h2>Team</h2>
        <p>Unlimited projects and a shared tag library.</p>
        <div class="btn" onclick="buy('team')">Choose Team</div>
      </div>
      <p>
        <a href="/contact">Contact sales</a> or
        <button type="button">Start a trial</button>
      </p>
    </main>
  </body>
</html>
